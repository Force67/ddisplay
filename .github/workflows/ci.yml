name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server-linux-amd64
            runner: ubuntu-24.04
            package: ddisplay-server
            bin: ddisplay-server
            apt: build-essential pkg-config clang libclang-dev libpipewire-0.3-dev libxcb1-dev
          - name: server-linux-arm64
            runner: ubuntu-24.04-arm
            package: ddisplay-server
            bin: ddisplay-server
            apt: build-essential pkg-config clang libclang-dev libpipewire-0.3-dev libxcb1-dev
          - name: client-linux-amd64
            runner: ubuntu-24.04
            package: ddisplay-client
            bin: ddisplay-client
            apt: build-essential pkg-config libssl-dev
          - name: client-linux-arm64
            runner: ubuntu-24.04-arm
            package: ddisplay-client
            bin: ddisplay-client
            apt: build-essential pkg-config libssl-dev
          - name: client-windows-amd64
            runner: windows-latest
            package: ddisplay-client
            bin: ddisplay-client.exe
            apt: ""

    steps:
      - uses: actions/checkout@v4

      # OpenH264 (openh264-sys2 -> nasm-rs) assembles x86/x86_64 sources with
      # nasm. arm64 builds use the C fallback and don't need it.
      - name: Install nasm
        if: runner.arch == 'X64'
        uses: ilammy/setup-nasm@v1

      # Cached APT install: .deb packages are restored from the GitHub cache on
      # a hit (no download / no apt-get update), keyed on the package set.
      #   server: PipeWire headers + libclang (Wayland bindgen) + cc for NVENC,
      #           and libxcb1-dev for the libxcb the x11rb XCB connection links
      #   client: OpenSSL for native-tls (reqwest / tokio-tungstenite)
      - name: Install and cache APT packages
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ${{ matrix.apt }}
          version: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo/{registry,git} and ./target, keyed on the lockfile and
      # rustc version (per build target via `key`). cache-on-failure keeps a
      # partial cache when a build breaks; only main writes the cache so PRs
      # read it without each producing their own copy.
      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build ${{ matrix.package }} (release)
        run: cargo build --release --locked -p ${{ matrix.package }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error

  # Kotlin/Gradle Android client. :core is pure JVM (unit-tested); :app is the
  # Compose UI. The runner's preinstalled ANDROID_HOME supplies the SDK, so no
  # local.properties is needed.
  client-android:
    name: client-android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches ~/.gradle (dependencies, wrapper dist, configuration cache).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and assemble
        run: cd client-android && ./gradlew --no-daemon :core:test :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: client-android-debug-apk
          path: client-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
