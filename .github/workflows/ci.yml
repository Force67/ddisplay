name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server-linux-amd64
            runner: ubuntu-24.04
            package: ddisplay-server
            bin: ddisplay-server
            kind: server
          - name: server-linux-arm64
            runner: ubuntu-24.04-arm
            package: ddisplay-server
            bin: ddisplay-server
            kind: server
          - name: client-linux-amd64
            runner: ubuntu-24.04
            package: ddisplay-client
            bin: ddisplay-client
            kind: client
          - name: client-linux-arm64
            runner: ubuntu-24.04-arm
            package: ddisplay-client
            bin: ddisplay-client
            kind: client
          - name: client-windows-amd64
            runner: windows-latest
            package: ddisplay-client
            bin: ddisplay-client.exe
            kind: client

    steps:
      - uses: actions/checkout@v4

      # OpenH264 (openh264-sys2 -> nasm-rs) assembles x86/x86_64 sources with
      # nasm. arm64 builds use the C fallback and don't need it.
      - name: Install nasm
        if: runner.arch == 'X64'
        uses: ilammy/setup-nasm@v1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.kind }}" = "server" ]; then
            # PipeWire headers + libclang (bindgen) for the Wayland backend;
            # build-essential/pkg-config for the NVENC wrapper (cc).
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config clang libclang-dev libpipewire-0.3-dev
          else
            # OpenSSL for native-tls (reqwest / tokio-tungstenite).
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config libssl-dev
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build ${{ matrix.package }} (release)
        run: cargo build --release --locked -p ${{ matrix.package }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error
