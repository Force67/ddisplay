[package]
name = "ddisplay-client"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket client (same protocol as web UI, upgrade to raw TCP later)
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = "0.3"
url = "2"

# Windowing + input (cross-platform, but we target Windows)
winit = "0.30"

# GPU rendering
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }

# H.264 decoding (software, cross-platform)
openh264 = "0.9"

# AV1 decoding via rav1d (pure Rust dav1d port, no nasm asm for cross-compile)
rav1d = { version = "1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# JSON parsing (for session info)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI arguments
clap = { version = "4", features = ["derive"] }

# Byte manipulation
byteorder = "1"

# Blocking async in sync context (for wgpu init)
pollster = "0.4"

# Safe casting for uniform buffer uploads
bytemuck = { version = "1", features = ["derive"] }
egui = "0.34.1"
egui-wgpu = "0.34.1"
egui-winit = { version = "0.34.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
