<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ddisplay</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="display"></canvas>
    <video id="video" muted playsinline autoplay style="display:none"></video>

    <div id="overlay" class="overlay">
        <div class="overlay-content">
            <div class="spinner"></div>
            <div id="connection-status">Connecting...</div>
        </div>
    </div>

    <div id="stats" class="stats">
        <span id="stat-fps">0 FPS</span>
        <span id="stat-latency">q:0</span>
        <span id="stat-resolution">-</span>
    </div>

    <script src="js/jmuxer.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
