[package]
name = "ddisplay-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# BGRA -> YUV/NV12 color conversion (scalar/NEON/AVX2), split out so it can
# be cross-compiled and tested standalone (e.g. x86_64 under qemu)
ddisplay-color = { path = "color" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web server + WebSocket
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }

# X11 screen capture and input (pure Rust)
x11rb = { version = "0.13", default-features = false, features = ["allow-unsafe-code", "composite", "shm", "xfixes", "xtest", "randr", "damage"] }

# H.264 encoder (Cisco OpenH264, built from source)
openh264 = "0.9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# CLI arguments
clap = { version = "4", features = ["derive"] }

# Dynamic library loading (for NVENC/CUDA at runtime)
libloading = "0.8"

# Stream utilities (needed for WebSocket split)
futures-util = "0.3"

# System V shared memory (for X11 SHM capture)
libc = "0.2"

# Shared state
parking_lot = "0.12"

# Wayland backend: Mutter ScreenCast/RemoteDesktop D-Bus session
zbus = "5"

# Wayland backend: PipeWire video stream consumption
# (build deps provisioned via nix — see .nix-deps/ and .cargo/config.toml [env])
pipewire = "0.8"

# Zip archive creation (for /download/client endpoint)
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "1"
